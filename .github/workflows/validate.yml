name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse JSON schemas and fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          schema_dir = Path("evaluate-subject-index/references/schemas")
          files = list(schema_dir.glob("*.json"))
          files += list(Path("evaluate-subject-index/tests").glob("*.json"))
          ids = {}
          for path in files:
              document = json.loads(path.read_text(encoding="utf-8"))
              identifier = document.get("$id") if path.parent == schema_dir else None
              if identifier:
                  if identifier in ids:
                      raise SystemExit(f"Duplicate schema $id: {identifier}")
                  ids[identifier] = path
              stack = [document]
              while stack:
                  value = stack.pop()
                  if isinstance(value, dict):
                      reference = value.get("$ref")
                      if isinstance(reference, str) and not reference.startswith(("#", "http://", "https://")):
                          target = (path.parent / reference.split("#", 1)[0]).resolve()
                          if not target.exists():
                              raise SystemExit(f"Missing local schema reference in {path}: {reference}")
                      stack.extend(value.values())
                  elif isinstance(value, list):
                      stack.extend(value)
          print(f"Parsed {len(files)} JSON files; schema IDs and local references are valid")
          PY
      - name: Compile deterministic helpers
        run: |
          python -m py_compile evaluate-subject-index/scripts/*.py
      - name: Run deterministic unit tests
        run: |
          python -m unittest discover -s evaluate-subject-index/tests -p 'test_*.py' -v
      - name: Exercise independent benchmark review and freeze gates
        run: |
          python evaluate-subject-index/scripts/benchmark_review_cli.py screen \
            --draft evaluate-subject-index/tests/source-benchmark.draft.valid.json \
            --output /tmp/benchmark-review-inventory.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          draft_path = Path("evaluate-subject-index/tests/source-benchmark.draft.valid.json")
          draft = json.loads(draft_path.read_text(encoding="utf-8"))
          inventory = json.loads(Path("/tmp/benchmark-review-inventory.json").read_text(encoding="utf-8"))

          def canonical_hash(value):
              clone = dict(value)
              clone.pop("benchmark_sha256", None)
              encoded = json.dumps(clone, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return hashlib.sha256(encoded).hexdigest()

          review = {
              "schema_version": "source-benchmark-review-v1",
              "evaluation_id": draft["evaluation_id"],
              "review_mode": "full",
              "candidate_blindness": "preserved",
              "reviewer_independence": {
                  "fresh_context": True,
                  "candidate_unseen": True,
                  "source_reconnected_sha256": draft["source_sha256"],
              },
              "draft": {
                  "path": draft_path.name,
                  "version": draft["version"],
                  "file_sha256": hashlib.sha256(draft_path.read_bytes()).hexdigest(),
                  "canonical_sha256": canonical_hash(draft),
              },
              "coverage": {
                  "subject_ids_reviewed": inventory["queues"]["subject_ids"],
                  "relationship_ids_reviewed": inventory["queues"]["relationship_ids"],
                  "reader_task_ids_reviewed": inventory["queues"]["reader_task_ids"],
                  "cross_chapter_subject_ids_reviewed": inventory["queues"]["cross_chapter_subject_ids"],
                  "unresolved_relationship_ids_dispositioned": inventory["queues"]["unresolved_relationship_ids"],
                  "fallback_reader_task_ids_reviewed": inventory["queues"]["fallback_reader_task_ids"],
              },
              "changes": {key: [] for key in (
                  "merges", "splits", "priority_changes", "relationship_changes",
                  "reader_task_changes", "subjects_added", "subjects_removed", "terminology_changes"
              )},
              "remaining_issues": [],
              "completion": {key: True for key in (
                  "structural_validation_passed", "editorial_review_complete",
                  "source_first_omission_review_complete", "candidate_blindness_preserved",
                  "no_unreviewed_required_items", "public_claims_allowed"
              )},
              "recommendation": "retain_draft",
          }
          Path("/tmp/benchmark-review.json").write_text(json.dumps(review, indent=2) + "\n", encoding="utf-8")

          final = dict(draft)
          final["schema_version"] = "source-subject-benchmark-v2"
          final.pop("synthesis")
          final["freeze"] = {
              "frozen_at": "2026-01-01T00:00:00Z",
              "synthesis_pass_complete": True,
              "page_coverage_complete": True,
          }
          final["benchmark_sha256"] = canonical_hash(final)
          Path("/tmp/source-benchmark.final.json").write_text(json.dumps(final, indent=2) + "\n", encoding="utf-8")
          PY
          python evaluate-subject-index/scripts/benchmark_review_cli.py validate-review \
            --draft evaluate-subject-index/tests/source-benchmark.draft.valid.json \
            --inventory /tmp/benchmark-review-inventory.json \
            --review /tmp/benchmark-review.json
          python evaluate-subject-index/scripts/benchmark_review_cli.py validate-final \
            --draft evaluate-subject-index/tests/source-benchmark.draft.valid.json \
            --inventory /tmp/benchmark-review-inventory.json \
            --review /tmp/benchmark-review.json \
            --final /tmp/source-benchmark.final.json
      - name: Exercise page mapping and chunk routing
        run: |
          python evaluate-subject-index/scripts/page_chunk_cli.py expand-page-map \
            --input evaluate-subject-index/tests/page-map-input.valid.json \
            --output /tmp/page-map.json
          python evaluate-subject-index/scripts/page_chunk_cli.py validate-chunks \
            --input evaluate-subject-index/tests/chunk-manifest.input.json \
            --page-map /tmp/page-map.json \
            --output /tmp/chunk-manifest.json
          python evaluate-subject-index/scripts/page_chunk_cli.py filter-candidate \
            --candidate evaluate-subject-index/tests/candidate-index.valid.json \
            --page-map /tmp/page-map.json \
            --chunks /tmp/chunk-manifest.json \
            --output-dir /tmp/locator-packets
      - name: Exercise standard policy and score arithmetic
        run: |
          python evaluate-subject-index/scripts/policy_cli.py build \
            --input evaluate-subject-index/tests/policy-build-input.valid.json \
            --output /tmp/evaluation-policy.json
          python evaluate-subject-index/scripts/score_cli.py density-profile \
            --input evaluate-subject-index/tests/density-chapters.valid.json \
            --output /tmp/density-profile.json
          python evaluate-subject-index/scripts/score_cli.py scorecard \
            --input evaluate-subject-index/tests/scorecard.valid.json
          python - <<'PY'
          import json

          policy = json.load(open("/tmp/evaluation-policy.json", encoding="utf-8"))
          density = json.load(open("/tmp/density-profile.json", encoding="utf-8"))
          assert policy["policy_profile"]["id"] == "subject-index-standard-policy-v1"
          assert policy["rubric"]["version"] == "subject-index-rubric-v4"
          assert [item["target"] for item in policy["density_profile"]["metrics"]] == [8.0, 20.0]
          assert density["chapter_measurements"][0]["calibration_counts"] == {
              "locator_bearing_heading_paths": 80.0,
              "locator_occurrences": 200.0,
          }
          assert density["fit_rating"] == 5.0
          PY
      - name: Exercise granular item grading and popovers
        run: |
          python evaluate-subject-index/scripts/item_grade_cli.py build-inventory \
            --candidate evaluate-subject-index/tests/candidate-index.valid.json \
            --output /tmp/item-inventory.json
          python evaluate-subject-index/scripts/item_grade_cli.py build-assessments \
            --candidate evaluate-subject-index/tests/candidate-index.valid.json \
            --inventory /tmp/item-inventory.json \
            --locator-audit evaluate-subject-index/tests/locator-audit.item-grading.valid.json \
            --missing-access-audit evaluate-subject-index/tests/missing-access-audit.item-grading.valid.json \
            --structure-audit evaluate-subject-index/tests/structure-audit.item-grading.valid.json \
            --audit-mode full \
            --output /tmp/item-assessments.json
          python - <<'PY'
          import json

          result = json.load(open("/tmp/item-assessments.json", encoding="utf-8"))
          assert result["grading_policy"] == "subject-index-item-grading-v1"
          assert result["summary"]["locators"]["bands"] == {
              "excellent": 1,
              "strong": 0,
              "mixed": 1,
              "weak": 0,
              "poor": 1,
              "not_measured": 0,
          }
          collections = (
              "locator_assessments",
              "path_assessments",
              "heading_node_assessments",
              "cross_reference_assessments",
              "source_subject_assessments",
          )
          for collection in collections:
              for item in result[collection]:
                  assert item["popover"]["title"]
                  assert item["popover"]["factors"]
                  assert item["popover"]["grade"] == item["grade"]
                  assert item["popover"]["grade_scope"] == item["grade_scope"]
                  assert item["popover"]["confidence"] == item["confidence"]
                  assert isinstance(item["popover"]["navigation"], dict)
                  if item["grade"]["score"] is None:
                      assert item["grade"]["color_token"] == "grade_neutral"
          assert result["cross_reference_assessments"][0]["target_path_id"] == "PATH-001"
          assert result["cross_reference_assessments"][0]["popover"]["navigation"]["target_path_id"] == "PATH-001"
          assert any(
              factor.get("applied_cap") == 85
              for item in result["path_assessments"]
              for factor in item["popover"]["factors"]
          )
          assert all(
              cap["summary"]
              for item in result["path_assessments"]
              for factor in item["popover"]["factors"]
              for cap in factor.get("severity_caps", [])
          )
          PY
      - name: Exercise artifact persistence and portable resume
        run: |
          run_dir="$(mktemp -d)"
          mkdir -p "$run_dir/study/source/chunks"
          python evaluate-subject-index/scripts/state_cli.py init \
            --output "$run_dir/study/evaluation-state.json" \
            --evaluation-id ci-storage-smoke \
            --source-title "CI storage smoke" \
            --source-file evaluate-subject-index/tests/candidate-index.valid.json \
            --document-page-start 1 \
            --document-page-end 10 \
            --intended-readership researchers \
            --storage-mode local
          python - "$run_dir/study/evaluation-state.json" <<'PY'
          import json
          import sys

          state = json.load(open(sys.argv[1], encoding="utf-8"))
          assert state["schema_version"] == "subject-index-evaluation-state-v4"
          stages = list(state["stages"])
          assert stages.index("benchmark_synthesis") < stages.index("benchmark_review") < stages.index("benchmark_freeze")
          PY
          cp evaluate-subject-index/tests/page-map-input.valid.json \
            "$run_dir/study/source/page-map.json"
          python evaluate-subject-index/scripts/state_cli.py set-stage \
            --state "$run_dir/study/evaluation-state.json" \
            --stage page_mapping \
            --status completed \
            --artifact-path "$run_dir/study/source/page-map.json" \
            --artifact-type page-map \
            --visibility private \
            --frozen
          cp evaluate-subject-index/tests/candidate-index.valid.json \
            "$run_dir/study/source/chunks/chunk-001.pdf"
          python evaluate-subject-index/scripts/state_cli.py set-stage \
            --state "$run_dir/study/evaluation-state.json" \
            --stage page_mapping \
            --status completed \
            --artifact-path "$run_dir/study/source/chunks/chunk-001.pdf" \
            --artifact-type source-chunk \
            --media-type application/pdf \
            --visibility restricted \
            --frozen
          python evaluate-subject-index/scripts/bundle_cli.py checkpoint \
            --state "$run_dir/study/evaluation-state.json" \
            --output "$run_dir/portable.zip"
          python evaluate-subject-index/scripts/bundle_cli.py import-bundle \
            --input "$run_dir/portable.zip" \
            --output-dir "$run_dir/imported"
          python evaluate-subject-index/scripts/state_cli.py validate \
            --state "$run_dir/imported/evaluation-state.json"
