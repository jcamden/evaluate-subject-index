name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check proposed diff
        run: git diff --check "origin/${{ github.event.repository.default_branch }}...HEAD"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse JSON schemas and fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema_dir = Path("evaluate-subject-index/references/schemas")
          files = list(schema_dir.glob("*.json"))
          files += list(Path("evaluate-subject-index/tests").glob("*.json"))
          ids = {}
          for path in files:
              document = json.loads(path.read_text(encoding="utf-8"))
              identifier = document.get("$id") if path.parent == schema_dir else None
              if path.parent == schema_dir:
                  Draft202012Validator.check_schema(document)
              if identifier:
                  if identifier in ids:
                      raise SystemExit(f"Duplicate schema $id: {identifier}")
                  ids[identifier] = path
              stack = [document]
              while stack:
                  value = stack.pop()
                  if isinstance(value, dict):
                      reference = value.get("$ref")
                      if isinstance(reference, str) and not reference.startswith(("#", "http://", "https://")):
                          target = (path.parent / reference.split("#", 1)[0]).resolve()
                          if not target.exists():
                              raise SystemExit(f"Missing local schema reference in {path}: {reference}")
                      stack.extend(value.values())
                  elif isinstance(value, list):
                      stack.extend(value)
          print(f"Parsed {len(files)} JSON files; schema IDs and local references are valid")
          PY
      - name: Compile deterministic helpers
        run: |
          python -m py_compile evaluate-subject-index/scripts/*.py
          python -m py_compile utilities/*.py
      - name: Run deterministic unit tests
        run: |
          python -m unittest discover -s evaluate-subject-index/tests -p 'test_*.py' -v
          python -m unittest discover -s utilities/tests -p 'test_*.py' -v
