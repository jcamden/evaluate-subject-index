name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Parse JSON schemas and fixtures
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = list(Path("evaluate-subject-index/references/schemas").glob("*.json"))
          files += list(Path("evaluate-subject-index/tests").glob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
          print(f"Parsed {len(files)} JSON files")
          PY
      - name: Compile deterministic helpers
        run: |
          python -m py_compile evaluate-subject-index/scripts/*.py
      - name: Exercise page mapping and chunk routing
        run: |
          python evaluate-subject-index/scripts/page_chunk_cli.py expand-page-map \
            --input evaluate-subject-index/tests/page-map-input.valid.json \
            --output /tmp/page-map.json
          python evaluate-subject-index/scripts/page_chunk_cli.py validate-chunks \
            --input evaluate-subject-index/tests/chunk-manifest.input.json \
            --page-map /tmp/page-map.json \
            --output /tmp/chunk-manifest.json
          python evaluate-subject-index/scripts/page_chunk_cli.py filter-candidate \
            --candidate evaluate-subject-index/tests/candidate-index.valid.json \
            --page-map /tmp/page-map.json \
            --chunks /tmp/chunk-manifest.json \
            --output-dir /tmp/locator-packets
      - name: Exercise standard policy and score arithmetic
        run: |
          python evaluate-subject-index/scripts/policy_cli.py build \
            --input evaluate-subject-index/tests/policy-build-input.valid.json \
            --output /tmp/evaluation-policy.json
          python evaluate-subject-index/scripts/score_cli.py density-profile \
            --input evaluate-subject-index/tests/density-chapters.valid.json \
            --output /tmp/density-profile.json
          python evaluate-subject-index/scripts/score_cli.py scorecard \
            --input evaluate-subject-index/tests/scorecard.valid.json
          python - <<'PY'
          import json

          policy = json.load(open("/tmp/evaluation-policy.json", encoding="utf-8"))
          density = json.load(open("/tmp/density-profile.json", encoding="utf-8"))
          assert policy["policy_profile"]["id"] == "subject-index-standard-policy-v1"
          assert policy["rubric"]["version"] == "subject-index-rubric-v4"
          assert [item["target"] for item in policy["density_profile"]["metrics"]] == [8.0, 20.0]
          assert density["chapter_measurements"][0]["calibration_counts"] == {
              "locator_bearing_heading_paths": 80.0,
              "locator_occurrences": 200.0,
          }
          assert density["fit_rating"] == 5.0
          PY
      - name: Exercise granular item grading and popovers
        run: |
          python evaluate-subject-index/scripts/item_grade_cli.py build-inventory \
            --candidate evaluate-subject-index/tests/candidate-index.valid.json \
            --output /tmp/item-inventory.json
          python evaluate-subject-index/scripts/item_grade_cli.py build-assessments \
            --candidate evaluate-subject-index/tests/candidate-index.valid.json \
            --inventory /tmp/item-inventory.json \
            --locator-audit evaluate-subject-index/tests/locator-audit.item-grading.valid.json \
            --missing-access-audit evaluate-subject-index/tests/missing-access-audit.item-grading.valid.json \
            --structure-audit evaluate-subject-index/tests/structure-audit.item-grading.valid.json \
            --audit-mode full \
            --output /tmp/item-assessments.json
          python - <<'PY'
          import json

          result = json.load(open("/tmp/item-assessments.json", encoding="utf-8"))
          assert result["grading_policy"] == "subject-index-item-grading-v1"
          assert result["summary"]["locators"]["bands"] == {
              "excellent": 1,
              "strong": 0,
              "mixed": 1,
              "weak": 0,
              "poor": 1,
              "not_measured": 0,
          }
          collections = (
              "locator_assessments",
              "path_assessments",
              "heading_node_assessments",
              "cross_reference_assessments",
              "source_subject_assessments",
          )
          for collection in collections:
              for item in result[collection]:
                  assert item["popover"]["title"]
                  assert item["popover"]["factors"]
                  assert item["popover"]["grade"] == item["grade"]
                  assert item["popover"]["grade_scope"] == item["grade_scope"]
                  assert item["popover"]["confidence"] == item["confidence"]
                  assert isinstance(item["popover"]["navigation"], dict)
                  if item["grade"]["score"] is None:
                      assert item["grade"]["color_token"] == "grade_neutral"
          assert result["cross_reference_assessments"][0]["target_path_id"] == "PATH-001"
          assert result["cross_reference_assessments"][0]["popover"]["navigation"]["target_path_id"] == "PATH-001"
          assert any(
              factor.get("applied_cap") == 85
              for item in result["path_assessments"]
              for factor in item["popover"]["factors"]
          )
          assert all(
              cap["summary"]
              for item in result["path_assessments"]
              for factor in item["popover"]["factors"]
              for cap in factor.get("severity_caps", [])
          )
          PY
      - name: Exercise artifact persistence and portable resume
        run: |
          run_dir="$(mktemp -d)"
          mkdir -p "$run_dir/study/source/chunks"
          python evaluate-subject-index/scripts/state_cli.py init \
            --output "$run_dir/study/evaluation-state.json" \
            --evaluation-id ci-storage-smoke \
            --source-title "CI storage smoke" \
            --source-file evaluate-subject-index/tests/candidate-index.valid.json \
            --document-page-start 1 \
            --document-page-end 10 \
            --intended-readership researchers \
            --storage-mode local
          cp evaluate-subject-index/tests/page-map-input.valid.json \
            "$run_dir/study/source/page-map.json"
          python evaluate-subject-index/scripts/state_cli.py set-stage \
            --state "$run_dir/study/evaluation-state.json" \
            --stage page_mapping \
            --status completed \
            --artifact-path "$run_dir/study/source/page-map.json" \
            --artifact-type page-map \
            --visibility private \
            --frozen
          cp evaluate-subject-index/tests/candidate-index.valid.json \
            "$run_dir/study/source/chunks/chunk-001.pdf"
          python evaluate-subject-index/scripts/state_cli.py set-stage \
            --state "$run_dir/study/evaluation-state.json" \
            --stage page_mapping \
            --status completed \
            --artifact-path "$run_dir/study/source/chunks/chunk-001.pdf" \
            --artifact-type source-chunk \
            --media-type application/pdf \
            --visibility restricted \
            --frozen
          python evaluate-subject-index/scripts/bundle_cli.py checkpoint \
            --state "$run_dir/study/evaluation-state.json" \
            --output "$run_dir/portable.zip"
          python evaluate-subject-index/scripts/bundle_cli.py import-bundle \
            --input "$run_dir/portable.zip" \
            --output-dir "$run_dir/imported"
          python evaluate-subject-index/scripts/state_cli.py validate \
            --state "$run_dir/imported/evaluation-state.json"
